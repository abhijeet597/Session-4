<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="auth-view">
    <h1>Habit Tracker</h1>

    <form id="login-form">
      <h2>Log In</h2>
      <input type="email" id="login-email" placeholder="Email" required>
      <input type="password" id="login-password" placeholder="Password" required>
      <button type="submit">Log In</button>
    </form>

    <form id="signup-form">
      <h2>Sign Up</h2>
      <input type="email" id="signup-email" placeholder="Email" required>
      <input type="password" id="signup-password" placeholder="Password" required>
      <button type="submit">Sign Up</button>
    </form>

    <p id="auth-error"></p>
  </div>

  <div id="app-view" hidden>
  <h1>Habit Tracker</h1>

  <button type="button" id="logout-btn">Log Out</button>

  <form id="add-habit-form">
    <input type="text" id="name" placeholder="Habit name" required>

    <select id="category" required></select>

    <select id="frequency" required>
      <option value="Daily">Daily</option>
      <option value="Weekly">Weekly</option>
      <option value="Monthly">Monthly</option>
    </select>

    <input type="number" id="day-of-month" placeholder="Day of month (1-31)" min="1" max="31" hidden>

    <button type="submit">Add Habit</button>
  </form>

  <form id="add-category-form">
    <input type="text" id="category-name" placeholder="New category" required>
    <button type="submit">Add Category</button>
  </form>

  <div id="sort-controls">
    <label for="sort-field">Sort by</label>

    <select id="sort-field">
      <option value="name">Name</option>
      <option value="category">Category</option>
      <option value="frequency">Frequency</option>
      <option value="checkins">Check-ins</option>
    </select>

    <select id="sort-dir">
      <option value="asc">Ascending</option>
      <option value="desc">Descending</option>
    </select>
  </div>

  <div id="filter-controls">
    <label for="filter-category">Filter by category</label>

    <select id="filter-category"></select>

    <label for="filter-date-from">Created from</label>
    <input type="date" id="filter-date-from">

    <label for="filter-date-to">Created to</label>
    <input type="date" id="filter-date-to">

    <button type="button" id="clear-filters">Clear Filters</button>
  </div>

  <table id="habit-table">
    <thead>
      <tr>
        <th>Habit</th>
        <th>Category</th>
        <th>Frequency</th>
        <th id="sort-checkins-header" class="sortable">Check-ins</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody id="habit-list-body"></tbody>
  </table>
  </div>

  <script src="js/habits.js"></script>
  <script src="js/render.js"></script>
  <script src="js/filter.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
